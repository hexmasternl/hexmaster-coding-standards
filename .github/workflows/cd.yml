name: CD

# Note what is absent: docs/**. The running server downloads the documents from GitHub
# itself, so publishing a standard reaches production on the next refresh rather than
# through a deployment.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Federated credentials, so no Azure client secret is stored in this public repository.
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: hexmaster-coding-standards

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Step one of the self-bootstrapping sequence: this creates the registry so there is
      # somewhere to push to. On a fresh resource group the app comes up on the template's
      # public placeholder image, which is what lets a first run succeed with an empty
      # registry.
      - name: Deploy infrastructure
        id: infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: infra/params/prod.bicepparam
          deploymentName: bootstrap-${{ github.run_id }}

      - name: Sign in to the container registry
        run: az acr login --name ${{ steps.infrastructure.outputs.registryName }}

      # Tagged with the full commit SHA, which is what makes a rollback a redeploy of an
      # existing tag rather than a rebuild. `latest` moves alongside it for convenience but
      # is never what the infrastructure references.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.infrastructure.outputs.registryLoginServer }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ steps.infrastructure.outputs.registryLoginServer }}/${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step two: pin the app to the image just pushed. Idempotent, so the repeated
      # infrastructure deployment costs seconds.
      - name: Deploy application
        id: application
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            infra/params/prod.bicepparam
            containerImage=${{ steps.infrastructure.outputs.registryLoginServer }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          deploymentName: release-${{ github.run_id }}

      # The app scales to zero, so this request is also what wakes it: it exercises the
      # real cold-start path, archive download included.
      - name: Verify the deployment is healthy
        run: |
          url="${{ steps.application.outputs.url }}"
          echo "Waiting for $url/health"

          for attempt in $(seq 1 30); do
            status=$(curl -s -o /tmp/health -w '%{http_code}' --max-time 30 "$url/health" || echo 000)

            if [ "$status" = "200" ]; then
              echo "Healthy after $attempt attempt(s): $(cat /tmp/health)"
              exit 0
            fi

            echo "Attempt $attempt: HTTP $status $(cat /tmp/health 2>/dev/null)"
            sleep 10
          done

          echo "::error::The deployed application did not report healthy."
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Endpoint | ${{ steps.application.outputs.url }} |"
            echo "| Image tag | \`${{ github.sha }}\` |"
            echo "| Registry | ${{ steps.infrastructure.outputs.registryLoginServer }} |"
            echo "| Container app | ${{ steps.application.outputs.containerAppName }} |"
            echo
            echo "Roll back by re-running this workflow's deploy step with a previous commit SHA tag."
          } >> "$GITHUB_STEP_SUMMARY"
