name: CD

# Note what is absent: docs/**. The running server downloads the documents from GitHub
# itself, so publishing a standard reaches production on the next refresh rather than
# through a deployment.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'GitVersion.yml'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  # OIDC federated credentials: there is no Azure client secret, only the client, tenant,
  # and subscription identifiers, which are repository secrets.
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: prod
    env:
      # Only the region the subscription-scoped deployment records itself in; the resources
      # take their location from the parameter file.
      AZURE_LOCATION: swedencentral
      MCP_PROJECT: src/HexMaster.CodingStandards.Mcp
    steps:
      - uses: actions/checkout@v4
        with:
          # GitVersion derives the image tag from the commit history, so the shallow clone
          # actions/checkout takes by default is not enough.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The SDK pushes the image using the credentials docker/login-action writes to
      # ~/.docker/config.json, so this is still the login step even though no docker build
      # happens.
      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_LOGIN_USERNAME }}
          password: ${{ secrets.ACR_LOGIN_PASSWORD }}

      # Asked of the project rather than assembled here, so the repository name and the
      # GitVersion tag have exactly one definition - the csproj - and the image the
      # container app is pinned to cannot drift from the image that was pushed.
      - name: Resolve the image reference
        id: image
        run: |
          properties=$(dotnet msbuild "$MCP_PROJECT" \
            -t:SetContainerImageTagFromGitVersion \
            -getProperty:ContainerRepository \
            -getProperty:ContainerImageTag \
            -nologo)

          repository=$(echo "$properties" | jq -er .Properties.ContainerRepository)
          tag=$(echo "$properties" | jq -er .Properties.ContainerImageTag)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=${{ secrets.ACR_LOGIN_SERVER }}/$repository:$tag" >> "$GITHUB_OUTPUT"

      # The image is pushed before the infrastructure is deployed, so the app's first
      # revision can be pinned to it straight away. The tag is the semantic version
      # GitVersion derives from the history, which is what makes a rollback a redeploy of
      # an existing tag rather than a rebuild. The registry comes from the secret rather
      # than the csproj default, so the push and the pull agree on one value.
      - name: Build and push container image
        run: >-
          dotnet publish "$MCP_PROJECT"
          --configuration Release
          -t:PublishContainer
          -p:ContainerRegistry=${{ secrets.ACR_LOGIN_SERVER }}

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # One deployment per release, subscription scoped: the template creates its own
      # resource group, so a bare subscription needs nothing prepared. The registry is not
      # ours to create and the image already exists by the time this runs; the registry
      # parameters are what let the container app pull it. registryPassword is a secure
      # parameter, so ARM does not retain its value in the deployment history.
      - name: Deploy infrastructure
        id: application
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: ${{ env.AZURE_LOCATION }}
          template: infra/main.bicep
          parameters: >-
            infra/params/prod.bicepparam
            containerImage=${{ steps.image.outputs.reference }}
            registryLoginServer=${{ secrets.ACR_LOGIN_SERVER }}
            registryUsername=${{ secrets.ACR_LOGIN_USERNAME }}
            registryPassword=${{ secrets.ACR_LOGIN_PASSWORD }}
          deploymentName: release-${{ github.run_id }}

      # The app scales to zero, so this request is also what wakes it: it exercises the
      # real cold-start path, catalog download included.
      - name: Verify the deployment is healthy
        run: |
          url="${{ steps.application.outputs.url }}"
          echo "Waiting for $url/health"

          for attempt in $(seq 1 30); do
            status=$(curl -s -o /tmp/health -w '%{http_code}' --max-time 30 "$url/health" || echo 000)

            if [ "$status" = "200" ]; then
              echo "Healthy after $attempt attempt(s): $(cat /tmp/health)"
              exit 0
            fi

            echo "Attempt $attempt: HTTP $status $(cat /tmp/health 2>/dev/null)"
            sleep 10
          done

          echo "::error::The deployed application did not report healthy."
          exit 1

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Endpoint | ${{ steps.application.outputs.url }} |"
            echo "| Image | \`${{ steps.image.outputs.reference }}\` |"
            echo "| Resource group | ${{ steps.application.outputs.resourceGroupName }} |"
            echo "| Container app | ${{ steps.application.outputs.containerAppName }} |"
            echo
            echo "Roll back by re-running this workflow pinned to a previously published version tag."
          } >> "$GITHUB_STEP_SUMMARY"
